<html>
<script src="https://rdf.js.org/comunica-browser/versions/v4/engines/query-sparql/comunica-browser.js"></script>

<body>
<h1 id="title">Credits/Production Details: </h1>

<table id="productiondetails" border=1>
  <tr id="instance">
  <th>Instance</th>
  </tr>
  <tr id="genre">
  <th>Genre</th>
  </tr>
  <tr id="production_company">
  <th>Production company</th>
  </tr>
  <tr id="language">
  <th>Language</th>
  </tr>
  <tr id="location1stperformance">
  <th>Location of 1st Performance</th>
  </tr>
  <tr id="date1stperformance">
  <th>Date of 1ste Performance</th>
  </tr>
</table>

<h2>Credits</h2>
<table id="credits" border=1>
</table>

<script language="JavaScript">  
  function GetURLParameter(sParam)
  {
    var sPageURL = window.location.search.substring(1);
    var sURLVariables = sPageURL.split('&');
    for (var i = 0; i < sURLVariables.length; i++) 
    {
      var sParameterName = sURLVariables[i].split('=');
      if (sParameterName[0] == sParam) 
      {
        return sParameterName[1];   }  }  };

  var q = GetURLParameter('q')

  new Comunica.QueryEngine().queryBindings(`
  
  PREFIX wd: <http://www.wikidata.org/entity/>
  PREFIX wdt: <http://www.wikidata.org/prop/direct/>
  PREFIX wikibase: <http://wikiba.se/ontology#>
  PREFIX p: <http://www.wikidata.org/prop/>
  PREFIX ps: <http://www.wikidata.org/prop/statement/>
  PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX bd: <http://www.bigdata.com/rdf#>

SELECT ?production ?productionLabel ?cLabel (GROUP_CONCAT(?creditDirectLabel; SEPARATOR = ", ") AS ?credits)

WHERE {
  BIND(wd:Q${q} as ?production)
  
  ?production ?credit ?c .
  FILTER(?credit IN (wdt:P272, wdt:P57, wdt:P5126, wdt:P1877, wdt:P3174, wdt:P86, wdt:P50, wdt:P87, wdt:P676, wdt:P655, wdt:P5202, wdt:P6086, wdt:P3300, wdt:P5024, wdt:P1809, wdt:P175, wdt:P664, wdt:P4608, wdt:P2554, wdt:P2515, wdt:P4805, wdt:P5026, wdt:P5028, wdt:P5881, wdt:P2554, wdt:P162, wdt:P170))
  ?creditDirect wikibase:directClaim ?credit .
  ?creditDirect rdfs:label ?creditDirectLabel .
  FILTER (lang(?creditDirectLabel) = "nl")
  
  SERVICE wikibase:label { bd:serviceParam wikibase:language "nl".}
  }
  
GROUP BY ?production ?productionLabel ?cLabel
`, {
  sources: [{ type: 'sparql', value: 'https://query.wikidata.org/sparql' }],
})
.then(function (bindingsStream) {
  bindingsStream.on('data', function (data) {
    document.getElementById("credits").innerHTML += "<tr>" + "<td>" + data.get('cLabel').value + "</td>" + "<td>" + data.get('credits').value + "</td></tr>";
  });
});

  new Comunica.QueryEngine().queryBindings(`
  
    PREFIX wd: <http://www.wikidata.org/entity/>
  PREFIX wdt: <http://www.wikidata.org/prop/direct/>
  PREFIX wikibase: <http://wikiba.se/ontology#>
  PREFIX p: <http://www.wikidata.org/prop/>
  PREFIX ps: <http://www.wikidata.org/prop/statement/>
  PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX bd: <http://www.bigdata.com/rdf#>

SELECT ?production ?productionLabel ?genericMemberLabel (GROUP_CONCAT(?roleLabel; SEPARATOR = ", ") AS ?credits)

WHERE {
  BIND(wd:Q${q} as ?production)
  
  # generic and role
  OPTIONAL {
    ?production ?p ?genericStatement .
	FILTER(?p IN (p:P767, p:P161))
    ?genericStatement ?ps ?genericMember .
	FILTER(?ps IN (ps:P767, ps:P161))
    OPTIONAL {
      ?genericStatement pq:P3831 ?role .
      ?role rdfs:label ?roleLabel .
      FILTER(LANG(?roleLabel) = 'nl')
    }
  }
  
  SERVICE wikibase:label { bd:serviceParam wikibase:language "nl".}
  }
  
GROUP BY ?production ?productionLabel ?genericMemberLabel
`, {
  sources: [{ type: 'sparql', value: 'https://query.wikidata.org/sparql' }],
})
.then(function (bindingsStream) {
  bindingsStream.on('data', function (data) {
    document.getElementById("credits").innerHTML += "<tr>" + "<td>" + data.get('genericMemberLabel').value + "</td>" + "<td>" + data.get('credits').value + "</td></tr>";
  });
});

new Comunica.QueryEngine().queryBindings(`

  PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX p: <http://www.wikidata.org/prop/>
PREFIX ps: <http://www.wikidata.org/prop/statement/>
PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX bd: <http://www.bigdata.com/rdf#>

SELECT ?production ?productionLabel ?eersteOpvoeringLocatieALabel ?eersteOpvoeringDatumALabel ?eersteOpvoeringLocatieBLabel ?eersteOpvoeringDatumBLabel
 (GROUP_CONCAT(distinct ?instance_ofLabel; SEPARATOR=', ') AS ?instances_of) 
 (GROUP_CONCAT(distinct ?genreLabel; SEPARATOR=', ') AS ?genres) 
 (GROUP_CONCAT(distinct ?production_companyLabel; SEPARATOR=', ') AS ?production_companies)  
 (GROUP_CONCAT(distinct ?languageLabel; SEPARATOR=', ') AS ?languages) 

WHERE {
  BIND(wd:Q${q} as ?production)
  
  OPTIONAL { ?production wdt:P31 ?instance_of.
             ?instance_of rdfs:label ?instance_ofLabel.
             FILTER(LANG(?instance_ofLabel) = "nl")
           }  
  OPTIONAL { ?production wdt:P136 ?genre.
             ?genre rdfs:label ?genreLabel.
             FILTER(LANG(?genreLabel) = "nl")
           }
  OPTIONAL { ?production wdt:P272 ?production_company.
             ?production_company rdfs:label ?production_companyLabel.
             FILTER(LANG(?production_companyLabel) = "nl")
           }
  OPTIONAL { ?production wdt:P407 ?language.
             ?language rdfs:label ?languageLabel.
             FILTER(LANG(?languageLabel) = "nl")
           }
  
  # Datum van de eerste opvoering via P1191 met qualifier P276 voor locatie
  OPTIONAL {
    ?production p:P1191 ?datumStatement .
    ?datumStatement ps:P1191 ?eersteOpvoeringDatumA .
    OPTIONAL {
      ?datumStatement pq:P276 ?eersteOpvoeringLocatieA .
    }
  }

  # Locatie van de eerste opvoering via P4647 met qualifier P585 voor datum
  OPTIONAL {
    ?production p:P4647 ?locatieStatement .
    ?locatieStatement ps:P4647 ?eersteOpvoeringLocatieB .
    OPTIONAL {
      ?locatieStatement pq:P585 ?eersteOpvoeringDatumB .
    }
  }
  SERVICE wikibase:label { bd:serviceParam wikibase:language "nl".}
}
GROUP BY ?production ?productionLabel ?eersteOpvoeringLocatieALabel ?eersteOpvoeringDatumALabel ?eersteOpvoeringLocatieBLabel ?eersteOpvoeringDatumBLabel
`, {
  sources: [{ type: 'sparql', value: 'https://query.wikidata.org/sparql' }],
}).then(function (bindingsStream) {
  bindingsStream.on('data', function (data) {
  document.getElementById("title").innerHTML += "<td>" + data.get('productionLabel').value + "</td>";
  document.getElementById("instance").innerHTML += "<td>" + data.get('instances_of').value + "</td>";
  document.getElementById("genre").innerHTML += "<td>" + data.get('genres').value + "</td>";
  document.getElementById("production_company").innerHTML += "<td>" + data.get('production_companies').value + "</td>";
  document.getElementById("language").innerHTML += "<td>" + data.get('languages').value + "</td>";
  document.getElementById("location1stperformance").innerHTML += "<td>" + data.get('eersteOpvoeringLocatieALabel').value + "</td>";
  document.getElementById("date1stperformance").innerHTML += "<td>" + data.get('eersteOpvoeringDatumALabel').value + "</td>";
  });
});

</script>

</html>
